<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İngilizce Kelime Öğrenme Platformu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header / Navigation -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-4">
      <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
        <span>📚</span> Kelime Ezberleme & Pekiştirme
      </h1>
      <nav class="flex gap-2 bg-slate-900 p-1 rounded-xl border border-slate-700">
        <button id="nav-cards" onclick="switchTab('cards')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all bg-indigo-600 text-white shadow">
          🎴 1. Kelime Kartları
        </button>
        <button id="nav-quiz" onclick="switchTab('quiz')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-slate-200">
          📝 2. Test
        </button>
        <button id="nav-match" onclick="switchTab('match')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-slate-200">
          🧩 3. Eşleştirme
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">

    <!-- TAB 1: FLASHCARDS -->
    <section id="tab-cards" class="flex flex-col items-center gap-6 my-auto">
      <div class="text-center">
        <h2 class="text-2xl font-bold text-slate-200">Kelime Öğrenme Kartları</h2>
        <p class="text-slate-400 text-sm mt-1">Karta tıklayarak Türkçe karşılığını ve detaylarını görebilirsiniz.</p>
      </div>

      <!-- Flashcard Container -->
      <div class="w-full max-w-md h-72 perspective-1000 cursor-pointer" onclick="flipCard()">
        <div id="flashcard" class="relative w-full h-full duration-500 transform-style-3d shadow-2xl rounded-2xl border border-indigo-500/30">
          
          <!-- Front Side -->
          <div class="absolute inset-0 w-full h-full bg-slate-800 rounded-2xl p-6 flex flex-col justify-between items-center text-center backface-hidden border border-slate-700">
            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-indigo-950 text-indigo-300 border border-indigo-800" id="card-counter">1 / 24</span>
            <div class="my-auto">
              <h3 id="card-word" class="text-3xl font-extrabold text-indigo-400 tracking-wide">Strip of</h3>
              <p id="card-synonym" class="text-sm text-slate-400 mt-2 font-medium"></p>
            </div>
            <p class="text-xs text-slate-500 italic">Anlamını görmek için dokunun 🔄</p>
          </div>

          <!-- Back Side -->
          <div class="absolute inset-0 w-full h-full bg-indigo-950/90 rounded-2xl p-6 flex flex-col justify-between items-center text-center backface-hidden rotate-y-180 border border-indigo-500/50">
            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-indigo-900 text-indigo-200">Türkçe Karşılığı</span>
            <div class="my-auto">
              <p id="card-meaning" class="text-xl font-bold text-white leading-relaxed">Bir şeyi birinden/bir yerden zorla çekip almak, soymak</p>
            </div>
            <p class="text-xs text-indigo-300/60 italic">Çevirmek için tekrar dokunun 🔄</p>
          </div>

        </div>
      </div>

      <!-- Flashcard Controls -->
      <div class="flex items-center gap-4 w-full max-w-md justify-between">
        <button onclick="prevCard()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-semibold border border-slate-700 transition">
          ◀ Önceki
        </button>
        <button onclick="nextCard()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold shadow-lg shadow-indigo-600/30 transition">
          Sonraki ▶
        </button>
      </div>
    </section>

    <!-- TAB 2: QUIZ -->
    <section id="tab-quiz" class="hidden flex-col gap-6">
      <div class="flex justify-between items-center border-b border-slate-800 pb-4">
        <div>
          <h2 class="text-2xl font-bold text-slate-200">Kelime Testi</h2>
          <p class="text-slate-400 text-sm">24 Kelimelik Çoktan Seçmeli Test</p>
        </div>
        <div class="text-right">
          <span id="quiz-progress" class="text-indigo-400 font-bold text-lg">Soru 1/24</span>
          <p id="quiz-score" class="text-xs text-slate-400 mt-1">Skor: 0 Doğru</p>
        </div>
      </div>

      <!-- Quiz Card -->
      <div id="quiz-container" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
        <h3 id="quiz-question" class="text-xl font-semibold text-slate-100 mb-6 leading-relaxed">
          Soru yükleniyor...
        </h3>

        <div id="quiz-options" class="grid grid-cols-1 gap-3">
          <!-- Options injected via JS -->
        </div>

        <!-- Explanation Container -->
        <div id="quiz-explanation" class="hidden mt-6 p-4 rounded-xl text-sm border"></div>

        <div class="mt-6 flex justify-end">
          <button id="quiz-next-btn" onclick="nextQuestion()" class="hidden px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold shadow-lg shadow-indigo-600/30 transition">
            Sonraki Soru ▶
          </button>
        </div>
      </div>
    </section>

    <!-- TAB 3: MATCHING GAME -->
    <section id="tab-match" class="hidden flex-col gap-6">
      <div class="flex justify-between items-center border-b border-slate-800 pb-4">
        <div>
          <h2 class="text-2xl font-bold text-slate-200">Kelime Eşleştirme</h2>
          <p class="text-slate-400 text-sm">İngilizce kelime ile doğru Türkçe karşılığını seçerek eşleştirin.</p>
        </div>
        <button onclick="initMatchGame()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold border border-slate-700">
          🔄 Yeniden Başlat
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- English Column -->
        <div class="flex flex-col gap-3">
          <h3 class="text-sm font-bold text-indigo-400 uppercase tracking-wider mb-1">İngilizce Kelimeler</h3>
          <div id="match-en-container" class="flex flex-col gap-2"></div>
        </div>

        <!-- Turkish Column -->
        <div class="flex flex-col gap-3">
          <h3 class="text-sm font-bold text-emerald-400 uppercase tracking-wider mb-1">Türkçe Anlamlar</h3>
          <div id="match-tr-container" class="flex flex-col gap-2"></div>
        </div>
      </div>
    </section>

  </main>

  <script>
    const vocabulary = [
      { id: 1, word: "Strip of", meaning: "Bir şeyi birinden/bir yerden zorla çekip almak, soymak", synonym: "deprive of" },
      { id: 2, word: "Retention", meaning: "Elde tutmak, muhafaza etmek", synonym: "holding, keeping" },
      { id: 3, word: "Alleviation", meaning: "Hafifletme (sıkıntı, stres)", synonym: "relief, mitigation" },
      { id: 4, word: "Fluctuation", meaning: "Dalgalanma (ruh hali, popülasyon, ekonomi)", synonym: "variation, instability" },
      { id: 5, word: "Implication", meaning: "Çıkarım, dolaylı sonuç, ima", synonym: "inference, suggestion" },
      { id: 6, word: "Disparity", meaning: "Farklılık, eşitsizlik (maaş, statü vb.)", synonym: "inequality, difference" },
      { id: 7, word: "Distinct", meaning: "Kendine has, ayırt edici, belirgin", synonym: "characteristic, clear" },
      { id: 8, word: "Mitigate", meaning: "Hafifletmek (stres, etki, ceza)", synonym: "alleviate, lessen" },
      { id: 9, word: "Advent", meaning: "Geliş, ortaya çıkış (örn. advent of technology)", synonym: "arrival, emergence" },
      { id: 10, word: "Despair", meaning: "Çaresizlik, umutsuzluk", synonym: "hopelessness" },
      { id: 11, word: "Undertaken", meaning: "Üstlenilmiş, yapılmış", synonym: "carried out" },
      { id: 12, word: "Intimidate", meaning: "Korkutmak, gözdağı vermek", synonym: "frighten, bully" },
      { id: 13, word: "Intrusive", meaning: "Müdahaleci, davetsizce giren (özel hayata vb.)", synonym: "invasive, meddlesome" },
      { id: 14, word: "Consolidate", meaning: "Sağlamlaştırmak, birleştirmek", synonym: "strengthen, combine" },
      { id: 15, word: "Tap into", meaning: "Bir kaynaktan yararlanmak, kullanmak", synonym: "utilize, make use of" },
      { id: 16, word: "Retrieve", meaning: "Gidip geri getirmek, veriye ulaşmak", synonym: "recover, get back" },
      { id: 17, word: "Robust", meaning: "Kuvvetli, güçlü, dayanıklı", synonym: "strong, sturdy" },
      { id: 18, word: "Impede", meaning: "Engellemek, zorlaştırmak", synonym: "hinder, obstruct" },
      { id: 19, word: "Ejection", meaning: "Tahliye etmek, dışarı çıkarmak", synonym: "expulsion, removal" },
      { id: 20, word: "Detonate", meaning: "Patlatmak", synonym: "explode, blow up" },
      { id: 21, word: "Campaigning", meaning: "Kampanya yürütme, sefere çıkma", synonym: "advocacy, drive" },
      { id: 22, word: "Tacit", meaning: "Söylenmeden anlaşılan, zımni", synonym: "implicit, unspoken" },
      { id: 23, word: "Contravention", meaning: "Karşı gelme, ihlal etme", synonym: "violation, breach" },
      { id: 24, word: "Bail out", meaning: "Birini ekonomik/zor durumdan kurtarmak", synonym: "rescue, financial help" }
    ];

    // Navigation Logic
    function switchTab(tab) {
      document.getElementById('tab-cards').classList.add('hidden');
      document.getElementById('tab-quiz').classList.add('hidden');
      document.getElementById('tab-match').classList.add('hidden');
      
      document.getElementById('nav-cards').className = "px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-slate-200";
      document.getElementById('nav-quiz').className = "px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-slate-200";
      document.getElementById('nav-match').className = "px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-slate-200";

      if (tab === 'cards') {
        document.getElementById('tab-cards').classList.remove('hidden');
        document.getElementById('nav-cards').className = "px-4 py-2 rounded-lg text-sm font-semibold transition-all bg-indigo-600 text-white shadow";
      } else if (tab === 'quiz') {
        document.getElementById('tab-quiz').classList.remove('hidden');
        document.getElementById('nav-quiz').className = "px-4 py-2 rounded-lg text-sm font-semibold transition-all bg-indigo-600 text-white shadow";
        if (quizCurrentIndex === 0 && !quizAnswered) loadQuizQuestion();
      } else if (tab === 'match') {
        document.getElementById('tab-match').classList.remove('hidden');
        document.getElementById('nav-match').className = "px-4 py-2 rounded-lg text-sm font-semibold transition-all bg-indigo-600 text-white shadow";
        initMatchGame();
      }
    }

    // --- 1. FLASHCARDS LOGIC ---
    let currentCardIndex = 0;
    let isFlipped = false;

    function updateCard() {
      const item = vocabulary[currentCardIndex];
      document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${vocabulary.length}`;
      document.getElementById('card-word').textContent = item.word;
      document.getElementById('card-synonym').textContent = item.synonym ? `(= ${item.synonym})` : '';
      document.getElementById('card-meaning').textContent = item.meaning;
      
      if (isFlipped) {
        document.getElementById('flashcard').classList.remove('rotate-y-180');
        isFlipped = false;
      }
    }

    function flipCard() {
      isFlipped = !isFlipped;
      if (isFlipped) {
        document.getElementById('flashcard').classList.add('rotate-y-180');
      } else {
        document.getElementById('flashcard').classList.remove('rotate-y-180');
      }
    }

    function nextCard() {
      currentCardIndex = (currentCardIndex + 1) % vocabulary.length;
      updateCard();
    }

    function prevCard() {
      currentCardIndex = (currentCardIndex - 1 + vocabulary.length) % vocabulary.length;
      updateCard();
    }

    // --- 2. QUIZ LOGIC ---
    let quizCurrentIndex = 0;
    let quizScore = 0;
    let quizAnswered = false;

    function loadQuizQuestion() {
      quizAnswered = false;
      const item = vocabulary[quizCurrentIndex];
      document.getElementById('quiz-progress').textContent = `Soru ${quizCurrentIndex + 1}/${vocabulary.length}`;
      document.getElementById('quiz-score').textContent = `Skor: ${quizScore} Doğru`;
      document.getElementById('quiz-question').textContent = `"${item.word}" kelimesinin doğru Türkçe karşılığı aşağıdakilerden hangisidir?`;

      // Generate Options
      const distractors = vocabulary
        .filter(v => v.id !== item.id)
        .sort(() => 0.5 - Math.random())
        .slice(0, 3)
        .map(v => v.meaning);

      const options = [...distractors, item.meaning].sort(() => 0.5 - Math.random());

      const optionsContainer = document.getElementById('quiz-options');
      optionsContainer.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 hover:bg-slate-800/80 transition font-medium text-slate-200 text-sm md:text-base";
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(btn, opt === item.meaning, item.meaning);
        optionsContainer.appendChild(btn);
      });

      document.getElementById('quiz-explanation').className = "hidden mt-6 p-4 rounded-xl text-sm border";
      document.getElementById('quiz-next-btn').classList.add('hidden');
    }

    function checkAnswer(selectedBtn, isCorrect, correctMeaning) {
      if (quizAnswered) return;
      quizAnswered = true;

      const buttons = document.getElementById('quiz-options').children;
      for (let btn of buttons) {
        btn.disabled = true;
        if (btn.textContent === correctMeaning) {
          btn.className = "w-full text-left p-4 rounded-xl bg-emerald-950/80 border-2 border-emerald-500 text-emerald-200 font-semibold text-sm md:text-base";
        } else if (btn === selectedBtn && !isCorrect) {
          btn.className = "w-full text-left p-4 rounded-xl bg-rose-950/80 border-2 border-rose-500 text-rose-200 font-semibold text-sm md:text-base";
        } else {
          btn.className = "w-full text-left p-4 rounded-xl bg-slate-900/50 border border-slate-800 text-slate-500 text-sm md:text-base";
        }
      }

      const expBox = document.getElementById('quiz-explanation');
      expBox.classList.remove('hidden');

      if (isCorrect) {
        quizScore++;
        document.getElementById('quiz-score').textContent = `Skor: ${quizScore} Doğru`;
        expBox.className = "mt-6 p-4 rounded-xl text-sm bg-emerald-950/40 border border-emerald-800/60 text-emerald-300";
        expBox.innerHTML = `<strong>Tebrikler! Doğru Cevap.</strong><br>${vocabulary[quizCurrentIndex].word}: ${correctMeaning}`;
      } else {
        expBox.className = "mt-6 p-4 rounded-xl text-sm bg-rose-950/40 border border-rose-800/60 text-rose-300";
        expBox.innerHTML = `<strong>Aman Dikkat!</strong><br>"${vocabulary[quizCurrentIndex].word}" kelimesinin doğru anlamı: <strong>${correctMeaning}</strong> olmalıdır.`;
      }

      document.getElementById('quiz-next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
      quizCurrentIndex++;
      if (quizCurrentIndex < vocabulary.length) {
        loadQuizQuestion();
      } else {
        showQuizResults();
      }
    }

    function showQuizResults() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = `
        <div class="text-center py-8">
          <h3 class="text-3xl font-extrabold text-indigo-400 mb-2">Test Tamamlandı! 🎉</h3>
          <p class="text-slate-300 text-lg mb-6">Toplam ${vocabulary.length} soruda <span class="text-emerald-400 font-bold">${quizScore} Doğru</span> yaptınız.</p>
          <button onclick="resetQuiz()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition">
            Testi Tekrar Çöz 🔄
          </button>
        </div>
      `;
    }

    function resetQuiz() {
      quizCurrentIndex = 0;
      quizScore = 0;
      location.reload();
    }

    // --- 3. MATCHING GAME LOGIC ---
    let selectedEn = null;
    let selectedTr = null;
    let matchedIds = [];

    function initMatchGame() {
      selectedEn = null;
      selectedTr = null;
      matchedIds = [];

      const enContainer = document.getElementById('match-en-container');
      const trContainer = document.getElementById('match-tr-container');
      enContainer.innerHTML = '';
      trContainer.innerHTML = '';

      // Shuffle lists
      const shufEn = [...vocabulary].sort(() => 0.5 - Math.random());
      const shufTr = [...vocabulary].sort(() => 0.5 - Math.random());

      shufEn.forEach(item => {
        const btn = document.createElement('button');
        btn.id = `match-en-${item.id}`;
        btn.className = "p-3 rounded-xl bg-slate-800 border border-slate-700 text-left font-semibold text-indigo-300 hover:bg-slate-700 transition text-sm";
        btn.textContent = item.word;
        btn.onclick = () => selectEn(item.id, btn);
        enContainer.appendChild(btn);
      });

      shufTr.forEach(item => {
        const btn = document.createElement('button');
        btn.id = `match-tr-${item.id}`;
        btn.className = "p-3 rounded-xl bg-slate-800 border border-slate-700 text-left font-medium text-slate-200 hover:bg-slate-700 transition text-xs md:text-sm";
        btn.textContent = item.meaning;
        btn.onclick = () => selectTr(item.id, btn);
        trContainer.appendChild(btn);
      });
    }

    function selectEn(id, btn) {
      if (matchedIds.includes(id)) return;
      
      // Reset previous selection UI
      if (selectedEn) {
        document.getElementById(`match-en-${selectedEn}`).classList.remove('border-indigo-500', 'bg-indigo-950/80');
      }

      selectedEn = id;
      btn.classList.add('border-indigo-500', 'bg-indigo-950/80');

      checkMatch();
    }

    function selectTr(id, btn) {
      if (matchedIds.includes(id)) return;

      if (selectedTr) {
        document.getElementById(`match-tr-${selectedTr}`).classList.remove('border-indigo-500', 'bg-indigo-950/80');
      }

      selectedTr = id;
      btn.classList.add('border-indigo-500', 'bg-indigo-950/80');

      checkMatch();
    }

    function checkMatch() {
      if (selectedEn !== null && selectedTr !== null) {
        const enBtn = document.getElementById(`match-en-${selectedEn}`);
        const trBtn = document.getElementById(`match-tr-${selectedTr}`);

        if (selectedEn === selectedTr) {
          // Correct Match
          matchedIds.push(selectedEn);
          enBtn.className = "p-3 rounded-xl bg-emerald-950/60 border border-emerald-500 text-emerald-400 font-semibold text-sm opacity-60 cursor-not-allowed";
          trBtn.className = "p-3 rounded-xl bg-emerald-950/60 border border-emerald-500 text-emerald-400 font-medium text-xs md:text-sm opacity-60 cursor-not-allowed";
          enBtn.textContent += " ✓";
          trBtn.textContent += " ✓";
          enBtn.disabled = true;
          trBtn.disabled = true;
        } else {
          // Incorrect Match
          enBtn.classList.add('border-rose-500', 'bg-rose-950/50');
          trBtn.classList.add('border-rose-500', 'bg-rose-950/50');

          setTimeout(() => {
            enBtn.classList.remove('border-rose-500', 'bg-rose-950/50', 'border-indigo-500', 'bg-indigo-950/80');
            trBtn.classList.remove('border-rose-500', 'bg-rose-950/50', 'border-indigo-500', 'bg-indigo-950/80');
          }, 600);
        }

        selectedEn = null;
        selectedTr = null;

        if (matchedIds.length === vocabulary.length) {
          setTimeout(() => {
            alert('Tebrikler! Tüm kelimeleri başarıyla eşleştirdiniz! 🎉');
          }, 300);
        }
      }
    }

    // Initial Setup
    updateCard();
  </script>
</body>
</html>
```eof

### 🌟 Hazırlanan Etkinlik Özellikleri:
1. **🎴 1. Kelime Kartları (Flashcards):** Ekran üzerindeki kartlara dokunarak kelimenin Türkçe karşılığını ve eş anlamlı detaylarını inceleyebilir, sağ/sol butonlarıyla 24 kelime arasında gezinebilirsiniz.
2. **📝 2. İnteraktif Test:** 24 kelimenin tamamını kapsayan çoktan seçmeli testtir. Şıkkı seçtiğinizde anında doğru/yanlış geri bildirimi alırsınız.
3. **🧩 3. Eşleştirme Oyunu:** Sol sütundaki İngilizce kelimelere tıklayıp sağ sütundaki Türkçe karşılığıyla eşleştirerek interaktif bir şekilde pratik yapabilirsiniz.
